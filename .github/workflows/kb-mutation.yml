name: kb mutation

# Mutation testing grades the test suite rather than the code, and it is slow
# (tens of minutes: every mutant spawns a fresh `bun test`). It is deliberately
# NOT part of Validate:
#
#   - As a PR gate it would add half an hour to every push, and a gate that slow
#     gets routed around.
#   - Its score is a signal, not a gate (DESIGN.md → Testing doctrine), and the
#     harness holds that: stryker.config.json sets no `thresholds.break`.
#
# The run is seeded (`KB_FAST_CHECK_SEED` in stryker.config.json), so every
# mutant meets the same property data as the source it is compared with and
# the survivor list is reproducible. So it runs weekly and on demand, and its
# value is the survivor list in the uploaded HTML report — not the headline
# percentage.

on:
  schedule:
    # Mondays 04:00 UTC.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kb-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: macos-15
    timeout-minutes: 120
    # The flake's Bun, as in Validate's kb job.
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Install dependencies
        run: bun install --cwd tools/kb --frozen-lockfile

      - name: Mutation run
        run: bun run test:mutation
        working-directory: tools/kb

      # The report is the deliverable: which mutants no test killed. Kept even
      # when the run fails, since that is exactly when the survivor list
      # matters.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: tools/kb/reports/mutation/
          if-no-files-found: warn
          retention-days: 30
