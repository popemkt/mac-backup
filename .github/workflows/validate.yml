name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Verify generated release sources
        run: nix run .#github-sources -- verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate formatting and evaluation
        run: |
          nix develop -c shellcheck .githooks/pre-commit scripts/github-sources
          nix develop -c actionlint
          nix develop -c sh -c 'find . -name "*.nix" -not -path "./.git/*" -print0 | xargs -0 nixfmt --check'
          nix develop -c statix check .
          nix develop -c deadnix --fail --exclude ./_sources/generated.nix .
          nix flake check --no-build

      - name: Build flake checks
        run: nix flake check

  # The kb datastore is TypeScript on Bun and shares nothing with the Nix
  # evaluation above, so it runs as its own job rather than serialising behind
  # a 45-minute flake build. macos-15 matches the only platform the suite has
  # ever run on; moving it to ubuntu would be cheaper but would conflate real
  # regressions with first-ever-Linux-run portability noise.
  kb:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --cwd tools/kb --frozen-lockfile

      # typecheck (every workspace package, through the Nx task graph) +
      # oxlint (type-aware, one scope) + knip + the repo-shape harness. This is
      # the entry point the waves build for exactly this purpose; do not inline
      # its parts. Invoked with bun, not npm: the workspace root declares
      # devEngines npm 12 and `npm run` fails EBADDEVENGINES on the runner.
      - name: Verify (typecheck, lint, boundaries, dead code)
        run: bun run verify
        working-directory: tools/kb

      - name: Core suite
        run: bun run test
        working-directory: tools/kb

      - name: UI suite
        run: bun run test:ui
        working-directory: tools/kb

      # Wider than the committed seeds that `bun test` already runs. Cheap
      # (pure, in-memory histories) and the only thing that exercises replay
      # determinism across seeds nobody has looked at.
      - name: Deterministic simulation sweep
        run: bun run test:dst
        working-directory: tools/kb

      - name: Generated docs match .kb data
        run: bun tools/kb/packages/cli/src/bin/docs-check.ts

      - name: kb media backup ownership
        run: ./scripts/check-kb-assets-backup.sh check
