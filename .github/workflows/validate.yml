name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Verify generated release sources
        run: nix run .#github-sources -- verify

      - name: Validate formatting and evaluation
        run: |
          nix develop -c shellcheck .githooks/pre-commit scripts/github-sources scripts/deadnix-repo
          nix develop -c actionlint
          nix develop -c sh -c 'find . -name "*.nix" -not -path "./.git/*" -print0 | xargs -0 nixfmt --check'
          nix develop -c statix check .
          nix develop -c scripts/deadnix-repo
          nix flake check --no-build

      - name: Build flake checks
        run: nix flake check

  # kb itself is built and tested in popemkt/kb; this repo only holds a small
  # kb store. The job checks that data, and the GAP markers that cite it, with
  # the release `kb` the flake pins, the same one every host installs, inside
  # the dev shell like the hook.
  kb-data:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: nix develop -c bash -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Generated docs match .kb data
        run: kb docs check

      - name: Rules and checks are wired to what they name
        run: kb check audit

      - name: Every GAP marker names an open gap
        run: git ls-files -z | kb check gaps --files-from -

      - name: kb media backup ownership
        run: ./scripts/check-kb-assets-backup.sh check
