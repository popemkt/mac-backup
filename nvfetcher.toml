[cli-proxy-api]
src.github = "router-for-me/CLIProxyAPI"
src.from_pattern = "^v(.+)$"
src.to_pattern = "\\1"
fetch.url = "https://github.com/router-for-me/CLIProxyAPI/releases/download/v$ver/CLIProxyAPI_$ver_darwin_aarch64.tar.gz"

[cursor-cli]
src.webpage = "https://cursor.com/install"
src.regex = 'downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]+)/\$\{OS\}'
fetch.url = "https://downloads.cursor.com/lab/$ver/darwin/arm64/agent-cli-package.tar.gz"

# Stable releases only: src.github follows GitHub's latest release, which
# excludes prereleases. The rolling `nightly` release replaces its assets
# daily, so a pinned nightly URL 404s within a day.
[logseq]
src.github = "logseq/logseq"
fetch.url = "https://github.com/logseq/logseq/releases/download/$ver/Logseq-darwin-arm64-$ver.zip"

[genoffice]
src.github_tag = "genspark-ai/genoffice"
src.include_regex = "^v[0-9].*"
src.from_pattern = "^v(.+)$"
src.to_pattern = "\\1"
fetch.url = "https://github.com/genspark-ai/genoffice/releases/download/v$ver/GenOffice-$ver-arm64.dmg"

# Stable releases only: upstream publishes betas (v5.4.0-beta.1) as ordinary,
# non-prerelease GitHub releases, so only a version filter reliably excludes
# them; GitHub's "latest" marker is whatever upstream last chose to set.
[chat2db]
src.github_tag = "OtterMind/Chat2DB"
src.include_regex = '^v[0-9]+\.[0-9]+\.[0-9]+$'
src.from_pattern = "^v(.+)$"
src.to_pattern = "\\1"
fetch.url = "https://github.com/OtterMind/Chat2DB/releases/download/v$ver/Chat2DB-Community-$ver-arm64.dmg"

[vite-plus]
src.github = "voidzero-dev/vite-plus"
src.from_pattern = "^v(.+)$"
src.to_pattern = "\\1"
fetch.url = "https://github.com/voidzero-dev/vite-plus/releases/download/v$ver/vp-aarch64-apple-darwin.tar.gz"

# kb's platform-independent release bundle; pkgs/kb wraps it with nixpkgs bun.
# GAP [[01M56X1F1XG657D70A8804PEQY]]: its build provenance is checked by hand, not by verify.
# Nightlies too: kb publishes v<next patch>-nightly.<UTC date> prereleases,
# which GitHub's latest release (src.github) skips, so this tracks tags.
# awesomeversion sorts a nightly above the stable release it follows and below
# the next one; nvchecker's default key puts every prerelease below every
# stable release, so the pin would never leave stable.
# kb prunes nightlies after 14 days, so a pin older than that no longer
# downloads.
[kb]
src.github_tag = "popemkt/kb"
src.include_regex = '^v[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9.]+)?$'
src.sort_version_key = "awesomeversion"
src.from_pattern = "^v(.+)$"
src.to_pattern = "\\1"
fetch.url = "https://github.com/popemkt/kb/releases/download/v$ver/kb-$ver.tar.gz"
