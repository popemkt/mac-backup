[cli-proxy-api]
src.github = "router-for-me/CLIProxyAPI"
src.from_pattern = "^v(.+)$"
src.to_pattern = "\\1"
fetch.url = "https://github.com/router-for-me/CLIProxyAPI/releases/download/v$ver/CLIProxyAPI_$ver_darwin_aarch64.tar.gz"

[cursor-cli]
src.webpage = "https://cursor.com/install"
src.regex = 'downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]+)/\$\{OS\}'
fetch.url = "https://downloads.cursor.com/lab/$ver/darwin/arm64/agent-cli-package.tar.gz"

# Stable releases only: src.github follows GitHub's latest release, which
# excludes prereleases. The rolling `nightly` release replaces its assets
# daily, so a pinned nightly URL 404s within a day.
[logseq]
src.github = "logseq/logseq"
fetch.url = "https://github.com/logseq/logseq/releases/download/$ver/Logseq-darwin-arm64-$ver.zip"

[genoffice]
src.github_tag = "genspark-ai/genoffice"
src.include_regex = "^v[0-9].*"
src.from_pattern = "^v(.+)$"
src.to_pattern = "\\1"
fetch.url = "https://github.com/genspark-ai/genoffice/releases/download/v$ver/GenOffice-$ver-arm64.dmg"

# Stable releases only: upstream publishes betas (v5.4.0-beta.1) as ordinary,
# non-prerelease GitHub releases, so only a version filter reliably excludes
# them; GitHub's "latest" marker is whatever upstream last chose to set.
[chat2db]
src.github_tag = "OtterMind/Chat2DB"
src.include_regex = '^v[0-9]+\.[0-9]+\.[0-9]+$'
src.from_pattern = "^v(.+)$"
src.to_pattern = "\\1"
fetch.url = "https://github.com/OtterMind/Chat2DB/releases/download/v$ver/Chat2DB-Community-$ver-arm64.dmg"

[vite-plus]
src.github = "voidzero-dev/vite-plus"
src.from_pattern = "^v(.+)$"
src.to_pattern = "\\1"
fetch.url = "https://github.com/voidzero-dev/vite-plus/releases/download/v$ver/vp-aarch64-apple-darwin.tar.gz"

# kb's platform-independent release bundle; pkgs/kb wraps it with nixpkgs bun.
# Nightlies too: kb publishes v<next patch>-nightly.<UTC date> prereleases,
# which GitHub's latest release (src.github) skips, so this tracks tags.
# awesomeversion sorts a nightly above the stable release it follows and below
# the next one; nvchecker's default key puts every prerelease below every
# stable release, so the pin would never leave stable.
# kb prunes nightlies after 14 days, so a pin older than that no longer
# downloads.
[kb]
src.github_tag = "popemkt/kb"
src.include_regex = '^v[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9.]+)?$'
src.sort_version_key = "awesomeversion"
src.from_pattern = "^v(.+)$"
src.to_pattern = "\\1"
fetch.url = "https://github.com/popemkt/kb/releases/download/v$ver/kb-$ver.tar.gz"
# Provenance (`github-sources provenance`): kb's stable releases (release.yml)
# and nightlies (nightly.yml) both build and attest the bundle through the
# reusable publish.yml, so that is the signer, and it builds only from main.
passthru.provenanceRepo = "popemkt/kb"
passthru.provenanceSignerIdentity = "https://github.com/popemkt/kb/.github/workflows/publish.yml@refs/heads/main"
passthru.provenanceSourceRef = "refs/heads/main"

# SpacetimeDB's prebuilt Linux release (pkgs/spacetimedb), for axioms' live
# mode; nixpkgs has 2.10.1. Pinned: axioms' module and SDKs name this exact
# release, and a server ahead of them is untested with them (2.x renamed core
# APIs between minors), so a person moves both together: a new axioms tag,
# then this pin.
[spacetimedb]
pinned = true
src.github = "clockworklabs/SpacetimeDB"
src.from_pattern = "^v(.+)$"
src.to_pattern = "\\1"
fetch.url = "https://github.com/clockworklabs/SpacetimeDB/releases/download/v$ver/spacetime-x86_64-unknown-linux-gnu.tar.gz"

# axioms (pkgs/axioms), built from source at a release tag: the server, the
# web UI and the SpacetimeDB module it publishes, so the three always match.
# Pinned: a tag is the decision to deploy, and pkgs/axioms carries the hashes
# of that tag's vendored crates, so a person moves the pin and the hashes
# together. The version keeps the tag's `v`, which fetch.github fetches by.
[axioms]
pinned = true
src.github_tag = "popemkt/axioms"
src.include_regex = '^v[0-9]+\.[0-9]+\.[0-9]+$'
fetch.github = "popemkt/axioms"

# ntfy's container image (pkgs/ntfy-image), which my.stacks.ntfy runs as a
# my.services container app: pinned by digest, never a moving tag. The
# version is the image tag (ntfy tags only releases, `v<x.y.z>`, besides
# `latest`, which never sorts above them). The platform is fixed to the
# server's, linux/amd64: the scheduled updater runs on an arm64 Mac, and an
# unset platform would pin that machine's image. The digest is that
# platform's manifest, which the portable compose file names too
# (docs/app-containers.md).
[ntfy-image]
src.container = "binwiederhier/ntfy"
fetch.docker = "binwiederhier/ntfy"
docker.os = "linux"
docker.arch = "amd64"

# Google Antigravity CLI (`agy`) for Linux (pkgs/antigravity-cli). Macs keep
# the Homebrew cask (`antigravity-cli`). The official installer script queries
# this manifest, whose URL embeds `<version>-<build>`.
[antigravity-cli]
src.webpage = "https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json"
src.regex = 'storage\.googleapis\.com/antigravity-public/antigravity-cli/([^/]+)/linux-x64/cli_linux_x64\.tar\.gz'
fetch.url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/$ver/linux-x64/cli_linux_x64.tar.gz"
