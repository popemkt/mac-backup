<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kb Favicon Design System & Gallery</title>
    <style>
      :root {
        --bg: #09090b;
        --card-bg: #18181b;
        --border: #27272a;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --amber: #f59e0b;
        --tab-bg: #121215;
      }
      body.light-theme {
        --bg: #fafafa;
        --card-bg: #ffffff;
        --border: #e4e4e7;
        --text: #09090b;
        --text-muted: #71717a;
        --amber: #d97706;
        --tab-bg: #f4f4f5;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 2rem 1.5rem;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 1.25rem;
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p.subtitle {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.9rem;
      }
      .theme-toggle {
        background: var(--card-bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.5rem 1rem;
        border-radius: 9999px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.25rem;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.15rem;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .card-title {
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0;
      }
      .tag {
        font-size: 0.68rem;
        padding: 0.2rem 0.55rem;
        border-radius: 9999px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .tag-minimal {
        background: rgba(113, 113, 122, 0.18);
        color: var(--text-muted);
      }
      .tag-bold {
        background: rgba(245, 158, 11, 0.18);
        color: var(--amber);
      }
      .tag-extreme {
        background: rgba(239, 68, 68, 0.18);
        color: #f87171;
      }

      .preview-row {
        display: flex;
        align-items: center;
        justify-content: space-around;
        background: rgba(113, 113, 122, 0.07);
        padding: 0.85rem 0.5rem;
        border-radius: 8px;
        border: 1px solid var(--border);
      }
      .preview-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.3rem;
      }
      .label {
        font-size: 0.65rem;
        color: var(--text-muted);
        font-family: ui-monospace, monospace;
      }
      .tab-simulation {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--tab-bg);
        border: 1px solid var(--border);
        padding: 0.45rem 0.75rem;
        border-radius: 6px;
        font-size: 0.78rem;
        font-weight: 500;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .desc {
        font-size: 0.8rem;
        color: var(--text-muted);
        line-height: 1.4;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <h1>kb Favicon Alternative Spectrum</h1>
          <p class="subtitle">
            Range of aesthetics: from understated minimal outliners to high-energy sci-fi
            cyber-nodes
          </p>
        </div>
        <button class="theme-toggle" onclick="document.body.classList.toggle('light-theme')">
          🌓 Toggle Light / Dark
        </button>
      </header>

      <div class="grid" id="gallery"></div>
    </div>

    <script>
      const items = [
        {
          id: "v1-branch",
          file: "../favicon.svg",
          title: "0. Branching Bullet",
          tag: "minimal",
          desc: "Current standard: amber parent bullet stepping down via 90° guide line to child bullet.",
        },
        {
          id: "1-minimal-tree",
          file: "1-minimal-tree.svg",
          title: "1. Multi-Child Tree",
          tag: "minimal",
          desc: "Classic hierarchy: amber root node branching to 2 distinct indented child nodes.",
        },
        {
          id: "2-bracket-transclusion",
          file: "2-bracket-transclusion.svg",
          title: "2. Wikilink [[ ● ]]",
          tag: "bold",
          desc: "Double transclusion brackets enclosing radiant core node. Pure PKM & outliner DNA.",
        },
        {
          id: "3-graph-constellation",
          file: "3-graph-constellation.svg",
          title: "3. Datalog Graph Triad",
          tag: "bold",
          desc: "Central amber hub with connected satellite nodes and dashed relations.",
        },
        {
          id: "4-atomic-orbit",
          file: "4-atomic-orbit.svg",
          title: "4. Atomic Hyper-Node",
          tag: "extreme",
          desc: "Over-the-top sci-fi: nucleus core node with dual tilted 3D orbital rings & electrons.",
        },
        {
          id: "5-radar-pulse",
          file: "5-radar-pulse.svg",
          title: "5. Knowledge Radar",
          tag: "extreme",
          desc: "Query sonar: amber node emitting concentric pulse waves across the graph.",
        },
        {
          id: "6-isometric-cube",
          file: "6-isometric-cube.svg",
          title: "6. 3D Spatial Cube",
          tag: "bold",
          desc: "Isometric 3D block with node vertices and translucent top plane (3D force graph motif).",
        },
        {
          id: "7-neo-brutalist",
          file: "7-neo-brutalist.svg",
          title: "7. Neo-Brutalist Pop",
          tag: "extreme",
          desc: "Chunky pop-art: offset solid drop shadow, heavy outlines, saturated amber badge.",
        },
        {
          id: "8-geometric-k",
          file: "8-geometric-k.svg",
          title: "8. Geometric 'k' Outliner",
          tag: "bold",
          desc: "The letter 'k' built out of outliner bullets and tree branches. Monogram + outliner.",
        },
        {
          id: "9-cyber-hex",
          file: "9-cyber-hex.svg",
          title: "9. Cyber Hex Matrix",
          tag: "extreme",
          desc: "Hexagonal datalog matrix: glowing dashed orbital ring around core nucleus with 6 peripheral nodes.",
        },
      ];

      const gallery = document.getElementById("gallery");
      items.forEach((it) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
        <div class="card-header">
          <h3 class="card-title">${it.title}</h3>
          <span class="tag tag-${it.tag}">${it.tag}</span>
        </div>
        <div class="preview-row">
          <div class="preview-box">
            <img src="${it.file}" width="48" height="48" alt="${it.title}">
            <span class="label">48px</span>
          </div>
          <div class="preview-box">
            <img src="${it.file}" width="32" height="32" alt="${it.title}">
            <span class="label">32px</span>
          </div>
          <div class="preview-box">
            <img src="${it.file}" width="16" height="16" alt="${it.title}">
            <span class="label">16px</span>
          </div>
        </div>
        <div class="tab-simulation">
          <img src="${it.file}" width="16" height="16">
          <span>kb — ${it.title.split(".")[1].trim()}</span>
        </div>
        <p class="desc">${it.desc}</p>
      `;
        gallery.appendChild(card);
      });
    </script>
  </body>
</html>
