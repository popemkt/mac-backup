<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .orb { stroke: #78716c; fill: none; stroke-width: 2; }
    .core { fill: #d97706; }
    .sat { fill: #1c1917; }
    @media (prefers-color-scheme: dark) {
      .orb { stroke: #a8a29e; }
      .core { fill: #f59e0b; }
      .sat { fill: #f5f5f4; }
    }
  </style>
  <!-- Tilted orbital ellipses -->
  <ellipse class="orb" cx="16" cy="16" rx="14" ry="5.5" transform="rotate(-30 16 16)" />
  <ellipse class="orb" cx="16" cy="16" rx="14" ry="5.5" transform="rotate(30 16 16)" />
  <!-- Core nucleus -->
  <circle class="core" cx="16" cy="16" r="5.5" />
  <!-- Orbiting nodes -->
  <circle class="sat" cx="5" cy="10" r="3" />
  <circle class="sat" cx="27" cy="10" r="3" />
</svg>
