<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .stem { stroke: #78716c; fill: none; stroke-width: 3; stroke-linecap: round; }
    .branch { stroke: #d97706; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .root-node { fill: #d97706; }
    .child-node { fill: #1c1917; }
    @media (prefers-color-scheme: dark) {
      .stem { stroke: #a8a29e; }
      .branch { stroke: #f59e0b; }
      .root-node { fill: #f59e0b; }
      .child-node { fill: #f5f5f4; }
    }
  </style>
  <!-- Vertical Tree Trunk (Letter K Stem) -->
  <line class="stem" x1="8" y1="6" x2="8" y2="26" />
  <!-- Upper & Lower K branches -->
  <line class="branch" x1="8" y1="16" x2="23" y2="7" />
  <line class="branch" x1="8" y1="16" x2="23" y2="25" />
  <!-- Node Bullets at junctions and tips -->
  <circle class="root-node" cx="8" cy="16" r="4.5" />
  <circle class="root-node" cx="8" cy="6" r="3.5" />
  <circle class="root-node" cx="8" cy="26" r="3.5" />
  <circle class="child-node" cx="23" cy="7" r="4" />
  <circle class="child-node" cx="23" cy="25" r="4" />
</svg>
