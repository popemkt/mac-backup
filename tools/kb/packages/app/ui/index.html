<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kb</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Blocking no-FOUC prefs: theme class + width attr before first paint
         (kb-prefs, DESIGN-RESKIN §1.7; pattern from nxus __root.tsx). -->
    <style>
      html[data-width="centered"] .kb-shell {
        max-width: 48rem;
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }
      html[data-width="full"] .kb-shell {
        padding-left: 2rem;
        padding-right: 2rem;
      }
    </style>
    <script>
      (function () {
        try {
          var theme = "system";
          var width = "centered";
          var stored = localStorage.getItem("kb-prefs");
          if (stored) {
            var s = JSON.parse(stored) || {};
            if (s.theme === "light" || s.theme === "dark") theme = s.theme;
            if (s.width === "full") width = "full";
          }
          var dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-width", width);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Blocking no-FOUC design system: the painter's record of its last paint
         (kb-design-system, stores/design-system.store.ts), its id and its sheet.
         In <body>, so the sheet lands after the bundle's stylesheet in <head>
         and beats layer 1, as the painter's own sheet does. The painter adopts
         the element; a stale record paints until the page paints its choice. -->
    <script>
      (function () {
        try {
          var painted = JSON.parse(localStorage.getItem("kb-design-system") || "null");
          if (!painted || typeof painted.id !== "string") return;
          document.documentElement.setAttribute("data-theme", painted.id);
          if (typeof painted.stylesheet !== "string" || painted.stylesheet === "") return;
          var sheet = document.createElement("style");
          sheet.setAttribute("data-design-system", painted.id);
          sheet.textContent = painted.stylesheet;
          document.head.appendChild(sheet);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
