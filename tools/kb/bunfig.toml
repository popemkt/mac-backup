# UI component tests that need vitest's mock-hoist / happy-dom (or WebGL)
# still run under `cd ui && bunx vp test`. Bun's recursive `bun test` from
# tools/kb would otherwise fail at import / act() / waitFor time.
[test]
pathIgnorePatterns = [
  "ui/src/components/graph/graph-page.component.test.tsx",
  "ui/src/components/ontology/ontology-page.component.test.tsx",
  "ui/src/components/ontology/ontology-scope.acceptance.test.tsx",
  "ui/src/components/outline/ghost-node-row.component.test.tsx",
  # Vitest-only: vi.mock hoist / happy-dom ErrorBoundary / fake-timer debounce.
  "ui/src/actions/mutations.debounce.test.ts",
  "ui/src/components/view-error-boundary.test.tsx",
]
